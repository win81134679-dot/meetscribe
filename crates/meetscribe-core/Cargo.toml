[package]
name = "meetscribe-core"
version = "1.1.1"
edition = "2024"
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
docx-rs = "0.4.22"
futures = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "system-proxy", "gzip", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
# Android 沒有 ffmpeg：原生音訊後端（解碼＋重取樣＋LAME 編 MP3）。meetscribe-android 會開這個 feature。
symphonia = { version = "0.5.5", optional = true, default-features = false, features = ["mp3", "aac", "isomp4", "wav", "pcm", "flac", "ogg", "vorbis"] }
mp3lame-encoder = { version = "0.2.5", optional = true }
p256 = "0.14.0"
sha2 = "0.11.1"

[features]
native-audio = ["dep:symphonia", "dep:mp3lame-encoder"]

# 桌面：Windows 認證管理員＋系統 TLS
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

# Android：沒有 OpenSSL，改用 rustls（ring）＋內建 Mozilla 根憑證
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
