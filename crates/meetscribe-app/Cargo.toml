[package]
name = "meetscribe-app"
version = "1.3.5"
edition = "2024"
license.workspace = true

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37.0"
egui_commonmark = "0.26.0"
egui_extras = "0.37.0"
meetscribe-core = { version = "1.3.5", path = "../meetscribe-core" }
open = "5.4.5"
rfd = "0.17.2"
rodio = "0.23.0"
tokio = "1.54.1"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.29.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Security", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "eframe", "snapshot"] }
tempfile = "3.27.0"
