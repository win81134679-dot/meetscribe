<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetScribe 處理流程圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f4f7fb; }
    /* A2 橫式滿版（594×420 mm = 2245×1587 CSS px）：SVG 就是整頁，標題也畫在 SVG 裡 */
    body { width: 2245px; height: 1587px; overflow: hidden; }
    .diagram-container { width: 2245px; height: 1587px; overflow-x: auto; }
    svg { width: 2245px; height: 1587px; min-width: 1280px; display: block; }
    .t-title { font: 400 44px 'Instrument Serif', 'Noto Serif TC', serif; letter-spacing: -0.01em; }
    .t-eyebrow { font: 500 13px 'Geist', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif; }
    .t-name { font: 600 16px 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
    .t-sub  { font: 400 12px 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
    .t-mono { font: 400 12px 'Geist Mono', ui-monospace, monospace; }
    .t-tag  { font: 500 8px 'Geist Mono', ui-monospace, monospace; letter-spacing: 0.08em; }
    .t-lbl  { font: 500 12px 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
    .t-zone { font: 500 13px 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; }
    .t-callout { font: italic 400 16px 'Instrument Serif', 'Noto Serif TC', serif; }
  </style>
</head>
<body>
<div class="diagram-container">
<svg viewBox="0 0 1280 904" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ms-flow-title ms-flow-desc">
<title id="ms-flow-title">MeetScribe 處理流程圖</title>
<desc id="ms-flow-desc">一場會議依序經過前處理、轉錄、說話者分配、摘要、匯出五個階段：前處理用本機 ffmpeg，轉錄用付費的 Nemotron 3.5 Transcribe，說話者與摘要用 Gemini 免費額度，摘要也可手動改用 Claude Code CLI，每一步完成都存檔、可從斷點續跑。</desc>
<defs>
<marker id="ms-flow-arr-proc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3949ab"/></marker>
<marker id="ms-flow-arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e27e00"/></marker>
</defs>

<!-- 背景與標題 -->
<rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="40" y="56" class="t-eyebrow" fill="#44506b">流程圖 · 一場會議從錄音到摘要</text>
<text x="40" y="112" class="t-title" fill="#14213d">五個階段，只有轉錄要付費，每一步都存檔可續跑</text>

<!-- 區塊：存檔續跑（最先畫） -->
<rect x="40" y="168" width="1200" height="536" rx="8" fill="#00897b" fill-opacity="0.03" stroke="#00897b" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="5,4"/>
<text x="56" y="192" class="t-zone" fill="#007e71">每一步完成就存進 project.json · 中斷、關程式、額度用完都從斷點續跑，不重複付費</text>
<text x="1224" y="192" class="t-mono" fill="#56627c" text-anchor="end">%APPDATA%\MeetScribe\projects\&lt;id&gt;</text>
<line x1="56" y1="404" x2="1224" y2="404" stroke="#14213d" stroke-opacity="0.10" stroke-width="0.8"/>
<text x="56" y="428" class="t-zone" fill="#56627c">各階段用什麼</text>

<!-- 連線（在節點之前）：階段之間 -->
<line x1="256" y1="272" x2="302" y2="272" stroke="#3949ab" stroke-width="1.2" marker-end="url(#ms-flow-arr-proc)"/>
<line x1="496" y1="272" x2="542" y2="272" stroke="#3949ab" stroke-width="1.2" marker-end="url(#ms-flow-arr-proc)"/>
<line x1="736" y1="272" x2="782" y2="272" stroke="#3949ab" stroke-width="1.2" marker-end="url(#ms-flow-arr-proc)"/>
<line x1="976" y1="272" x2="1022" y2="272" stroke="#3949ab" stroke-width="1.2" marker-end="url(#ms-flow-arr-proc)"/>
<!-- 階段 → 用的工具或模型 -->
<line x1="160" y1="328" x2="160" y2="446" stroke="#3949ab" stroke-width="1.2" marker-end="url(#ms-flow-arr-proc)"/>
<line x1="400" y1="328" x2="400" y2="446" stroke="#e27e00" stroke-width="1.6" marker-end="url(#ms-flow-arr-accent)"/>
<line x1="640" y1="328" x2="640" y2="446" stroke="#3949ab" stroke-width="1.2" marker-end="url(#ms-flow-arr-proc)"/>
<line x1="848" y1="328" x2="848" y2="446" stroke="#3949ab" stroke-width="1.2" marker-end="url(#ms-flow-arr-proc)"/>
<path d="M 912,328 V 368 Q 912,376 920,376 H 1112 Q 1120,376 1120,384 V 446" fill="none" stroke="#3949ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-flow-arr-proc)"/>

<!-- 連線標籤（遮罩在線外，留 8px） -->
<rect x="168" y="352" width="68" height="16" rx="2" fill="#f4f7fb"/>
<text x="202" y="364" class="t-lbl" fill="#3949ab" text-anchor="middle">轉檔・切段</text>
<rect x="408" y="352" width="56" height="16" rx="2" fill="#f4f7fb"/>
<text x="436" y="364" class="t-lbl" fill="#a65c00" text-anchor="middle">分段音訊</text>
<rect x="648" y="352" width="80" height="16" rx="2" fill="#f4f7fb"/>
<text x="688" y="364" class="t-lbl" fill="#3949ab" text-anchor="middle">音訊＋逐字稿</text>
<rect x="800" y="352" width="40" height="16" rx="2" fill="#f4f7fb"/>
<text x="820" y="364" class="t-lbl" fill="#3949ab" text-anchor="middle">預設</text>
<rect x="976" y="352" width="80" height="16" rx="2" fill="#f4f7fb"/>
<text x="1016" y="364" class="t-lbl" fill="#3949ab" text-anchor="middle">或手動切換</text>

<!-- 階段 01 前處理 -->
<rect x="64" y="216" width="192" height="112" rx="6" fill="#f4f7fb"/>
<rect x="64" y="216" width="192" height="112" rx="6" fill="#c7cde8" stroke="#3949ab" stroke-width="1.2"/>
<rect x="72" y="222" width="20" height="12" rx="2" fill="none" stroke="#3949ab" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="82" y="231" class="t-tag" fill="#3949ab" text-anchor="middle">01</text>
<text x="160" y="262" class="t-name" fill="#14213d" text-anchor="middle">前處理</text>
<text x="160" y="284" class="t-sub" fill="#44506b" text-anchor="middle">轉成 16 kHz 單聲道</text>
<text x="160" y="304" class="t-sub" fill="#44506b" text-anchor="middle">在停頓處切成約 10 分鐘一段</text>

<!-- 階段 02 轉錄 -->
<rect x="304" y="216" width="192" height="112" rx="6" fill="#f4f7fb"/>
<rect x="304" y="216" width="192" height="112" rx="6" fill="#c7cde8" stroke="#3949ab" stroke-width="1.2"/>
<rect x="312" y="222" width="20" height="12" rx="2" fill="none" stroke="#3949ab" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="322" y="231" class="t-tag" fill="#3949ab" text-anchor="middle">02</text>
<text x="400" y="262" class="t-name" fill="#14213d" text-anchor="middle">轉錄</text>
<text x="400" y="284" class="t-sub" fill="#44506b" text-anchor="middle">各段同時送出</text>
<text x="400" y="304" class="t-sub" fill="#44506b" text-anchor="middle">服務忙碌逾時自動重送</text>

<!-- 階段 03 說話者 -->
<rect x="544" y="216" width="192" height="112" rx="6" fill="#f4f7fb"/>
<rect x="544" y="216" width="192" height="112" rx="6" fill="#c7cde8" stroke="#3949ab" stroke-width="1.2"/>
<rect x="552" y="222" width="20" height="12" rx="2" fill="none" stroke="#3949ab" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="562" y="231" class="t-tag" fill="#3949ab" text-anchor="middle">03</text>
<text x="640" y="262" class="t-name" fill="#14213d" text-anchor="middle">說話者</text>
<text x="640" y="284" class="t-sub" fill="#44506b" text-anchor="middle">逐段標出每句是誰說的</text>
<text x="640" y="304" class="t-sub" fill="#44506b" text-anchor="middle">附聲音樣本跨段比對、合併</text>

<!-- 階段 04 摘要 -->
<rect x="784" y="216" width="192" height="112" rx="6" fill="#f4f7fb"/>
<rect x="784" y="216" width="192" height="112" rx="6" fill="#c7cde8" stroke="#3949ab" stroke-width="1.2"/>
<rect x="792" y="222" width="20" height="12" rx="2" fill="none" stroke="#3949ab" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="802" y="231" class="t-tag" fill="#3949ab" text-anchor="middle">04</text>
<text x="880" y="262" class="t-name" fill="#14213d" text-anchor="middle">摘要</text>
<text x="880" y="284" class="t-sub" fill="#44506b" text-anchor="middle">先判斷會議性質再選格式</text>
<text x="880" y="304" class="t-sub" fill="#44506b" text-anchor="middle">長會議分段筆記再合併</text>

<!-- 階段 05 匯出 -->
<rect x="1024" y="216" width="192" height="112" rx="6" fill="#f4f7fb"/>
<rect x="1024" y="216" width="192" height="112" rx="6" fill="#c7cde8" stroke="#3949ab" stroke-width="1.2"/>
<rect x="1032" y="222" width="20" height="12" rx="2" fill="none" stroke="#3949ab" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="1042" y="231" class="t-tag" fill="#3949ab" text-anchor="middle">05</text>
<text x="1120" y="262" class="t-name" fill="#14213d" text-anchor="middle">核對與匯出</text>
<text x="1120" y="284" class="t-sub" fill="#44506b" text-anchor="middle">完成即自動匯出，可再改再匯</text>
<text x="1120" y="304" class="t-mono" fill="#44506b" text-anchor="middle">docx · md · srt · vtt …</text>

<!-- 工具：ffmpeg（外部，灰藍） -->
<rect x="64" y="448" width="192" height="104" rx="6" fill="#f4f7fb"/>
<rect x="64" y="448" width="192" height="104" rx="6" fill="#d6dee4" stroke="#78909c" stroke-width="1.2"/>
<rect x="72" y="454" width="24" height="12" rx="2" fill="none" stroke="#78909c" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="84" y="463" class="t-tag" fill="#4f5f67" text-anchor="middle">EXT</text>
<text x="160" y="490" class="t-name" fill="#14213d" text-anchor="middle">ffmpeg</text>
<text x="160" y="512" class="t-mono" fill="#44506b" text-anchor="middle">silencedetect</text>
<text x="160" y="532" class="t-sub" fill="#44506b" text-anchor="middle">本機・免費</text>

<!-- 模型：Nemotron（焦點，橘） -->
<rect x="304" y="448" width="192" height="104" rx="6" fill="#f4f7fb"/>
<rect x="304" y="448" width="192" height="104" rx="6" fill="#f6ddbf" stroke="#fb8c00" stroke-width="1.2"/>
<rect x="312" y="454" width="28" height="12" rx="2" fill="none" stroke="#fb8c00" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="326" y="463" class="t-tag" fill="#925100" text-anchor="middle">STT</text>
<text x="400" y="490" class="t-name" fill="#14213d" text-anchor="middle">Nemotron 3.5</text>
<text x="400" y="512" class="t-mono" fill="#44506b" text-anchor="middle">OpenRouter</text>
<text x="400" y="532" class="t-sub" fill="#a65c00" text-anchor="middle">付費 ≈ US$0.12／小時</text>

<!-- 模型：Gemini（AI，紫） -->
<rect x="544" y="448" width="432" height="104" rx="6" fill="#f4f7fb"/>
<rect x="544" y="448" width="432" height="104" rx="6" fill="#dcc4e8" stroke="#8e24aa" stroke-width="1.2"/>
<rect x="552" y="454" width="20" height="12" rx="2" fill="none" stroke="#8e24aa" stroke-opacity="0.6" stroke-width="0.8"/>
<text x="562" y="463" class="t-tag" fill="#8b23a7" text-anchor="middle">AI</text>
<text x="760" y="490" class="t-name" fill="#14213d" text-anchor="middle">Gemini Flash（免費額度）</text>
<text x="760" y="512" class="t-mono" fill="#44506b" text-anchor="middle">Google AI Studio · 沒 Key 改用 OpenRouter :free</text>
<text x="760" y="532" class="t-sub" fill="#44506b" text-anchor="middle">回傳「句號・說話者・秒數」；整合重複的人、推測姓名、寫摘要</text>

<!-- 選項：Claude Code CLI（可選，黃虛線） -->
<rect x="1024" y="448" width="192" height="104" rx="6" fill="#f4f7fb"/>
<rect x="1024" y="448" width="192" height="104" rx="6" fill="#f6eaca" stroke="#d8a527" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="1032" y="454" width="28" height="12" rx="2" fill="none" stroke="#d8a527" stroke-opacity="0.8" stroke-width="0.8"/>
<text x="1046" y="463" class="t-tag" fill="#836417" text-anchor="middle">OPT</text>
<text x="1120" y="490" class="t-name" fill="#14213d" text-anchor="middle">Claude Code CLI</text>
<text x="1120" y="512" class="t-mono" fill="#44506b" text-anchor="middle">claude -p</text>
<text x="1120" y="532" class="t-sub" fill="#44506b" text-anchor="middle">用你的 Claude 訂閱</text>

<!-- 說明 -->
<text x="64" y="608" class="t-callout" fill="#44506b">逐字稿文字永遠來自 Nemotron；Gemini 不重寫內容，只回答「第幾句是誰說的」，所以不會漏字。</text>
<text x="64" y="640" class="t-callout" fill="#44506b">2 到 1000 人都適用：每段新出現的人先給臨時編號，最後再保守地合併成同一位。</text>

<!-- 圖例 -->
<line x1="40" y1="764" x2="1240" y2="764" stroke="#44506b" stroke-opacity="0.25" stroke-width="0.8"/>
<text x="40" y="796" class="t-lbl" fill="#44506b">圖例</text>
<rect x="88" y="786" width="14" height="10" rx="2" fill="#c7cde8" stroke="#3949ab" stroke-width="1"/>
<text x="110" y="796" class="t-sub" fill="#44506b">處理階段</text>
<rect x="190" y="786" width="14" height="10" rx="2" fill="#f6ddbf" stroke="#fb8c00" stroke-width="1"/>
<text x="212" y="796" class="t-sub" fill="#44506b">付費（焦點）</text>
<rect x="306" y="786" width="14" height="10" rx="2" fill="#dcc4e8" stroke="#8e24aa" stroke-width="1"/>
<text x="328" y="796" class="t-sub" fill="#44506b">免費 AI 模型</text>
<rect x="424" y="786" width="14" height="10" rx="2" fill="#f6eaca" stroke="#d8a527" stroke-width="1" stroke-dasharray="3,2"/>
<text x="446" y="796" class="t-sub" fill="#44506b">可選</text>
<rect x="498" y="786" width="14" height="10" rx="2" fill="#d6dee4" stroke="#78909c" stroke-width="1"/>
<text x="520" y="796" class="t-sub" fill="#44506b">本機工具</text>
<rect x="594" y="786" width="14" height="10" rx="2" fill="#00897b" fill-opacity="0.06" stroke="#00897b" stroke-width="1" stroke-dasharray="3,2"/>
<text x="616" y="796" class="t-sub" fill="#44506b">存檔範圍</text>
<line x1="690" y1="791" x2="718" y2="791" stroke="#3949ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-flow-arr-proc)"/>
<text x="726" y="796" class="t-sub" fill="#44506b">手動切換才走</text>
</svg>
</div>
</body>
</html>
